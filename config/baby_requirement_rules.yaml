# Owned-item canonicalization: baby.yaml `q_owned` options → the slot_key they
# fulfil. "없음" (none) intentionally maps to nothing.
owned_item_slot_map:
  유모차: stroller
  카시트: car_seat
  젖병: bottle
  아기침대: crib
  기저귀: diaper
