# Baby need-area → product-slot requirement rules (P2_catalog_requirements.md).
#
# Versioned DATA, not code: each rule maps one of the 9 allowed `needs` values
# (config/categories/baby.yaml `question_sets.q_needs.options`) to a slot_key
# whose category_code is seeded by scripts/seed_baby_catalog.py. Every one of the
# 9 need areas below has at least one rule OR an explicit `data_gap: true` entry —
# 의류 (clothing) has no curated category in scripts/유아용품_가상제품_스펙사전_v1.json's
# 23 supported families, so it is declared as a data_gap rather than mapped to an
# unrelated category or a fabricated product.
#
# age_window is in whole months and applies to mode: born only; it decides
# `timing` (now/soon/later), never whether the requirement exists at all — an
# item outside its window is still a real future need, not silently dropped.
# These windows are internal demo scheduling values, not medical guidance
# (CONTRACTS.md: "Demo age windows are test rules, not medical advice").
#
# applicability predicates reference normalized condition fields
# (independent_sitting, weight_kg); an unanswered predicate is carried through
# as "unknown" rather than assumed true or false (CandidateCheck/eligibility
# resolves it later — this file only declares the requirement, never fabricates
# an eligibility verdict).

rule_set_version: "baby-rules-v1"

rules:
  # ── 수유 (feeding) ────────────────────────────────────────────────
  - rule_key: feeding_bottle_v1
    needs: ["수유"]
    slot_key: bottle
    category_code: bottle
    mode: [born, prenatal]
    age_window: {min_months: 0, max_months: null}
    mandatory: true
    required_qty: 2
    unit_code: each
    source_kind: synthetic_demo
    source_ref: "scripts/유아용품_가상제품_스펙사전_v1.json#bottle"
    review_status: unreviewed

  - rule_key: feeding_formula_v1
    needs: ["수유"]
    slot_key: formula
    category_code: formula
    mode: [born, prenatal]
    age_window: {min_months: 0, max_months: 12}
    mandatory: false
    required_qty: 1
    unit_code: each
    source_kind: synthetic_demo
    source_ref: "scripts/유아용품_가상제품_스펙사전_v1.json#formula"
    review_status: unreviewed

  # ── 이유식·식사 (weaning / meals) ─────────────────────────────────
